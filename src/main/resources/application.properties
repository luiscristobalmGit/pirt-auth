# =============================================
# CONFIGURACIÓN BÁSICA DEL SERVIDOR
# =============================================
server.port=8080
server.servlet.context-path=/auth
spring.profiles.active=prod

# =============================================
# CONFIGURACIÓN DE BASE DE DATOS
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PIRT;encrypt=true;trustServerCertificate=true
spring.datasource.username=lmorteo
spring.datasource.password=Confioenti26
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================
# CONFIGURACIÓN HIKARI CP
# =============================================
spring.datasource.hikari.pool-name=PirtAuthPool
spring.datasource.hikari.schema=dbo
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000

# =============================================
# CONFIGURACIÓN JPA/HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# =============================================
# CONFIGURACIONES ADICIONALES
# =============================================
spring.main.allow-circular-references=true
spring.jpa.open-in-view=false

# =============================================
# CONFIGURACIÓN SPRINGDOC OPENAPI
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =============================================
# CONFIGURACIÓN ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=healthcheck

# =============================================
# CONFIGURACIÓN DE LOGS
# =============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=TRACE

# Configuración JWT
jwt.secret=VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIEpXVCAyNTYgYml0cyE= 
jwt.expiration=86400000

# Configuración de seguridad
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

logging.level.org.springframework.security=DEBUG
logging.level.mx.gob.sev.serv=TRACE
logging.level.org.springframework.web=DEBUG